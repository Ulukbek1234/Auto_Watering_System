<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Pi Control Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
      body { font-family: system-ui, sans-serif; margin: 16px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .card { border: 1px solid #ddd; border-radius: 12px; padding: 12px; }
      .grid-container { 
        display: grid; 
        grid-template-columns: repeat(4, 1fr); 
        grid-template-rows: repeat(4, 120px);
        gap: 12px; 
      }
      button { padding: 10px 12px; border-radius: 10px; border: 1px solid #ccc; background: #f7f7f7; cursor: pointer; }
      button:active { transform: translateY(1px); }
      #logs { height: 260px; overflow: auto; background: #0b0b0b; color: #eaeaea; padding: 10px; border-radius: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
      img { width: 100%; border-radius: 12px; border: 1px solid #ddd; }
      @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <h2>Uluks Grow Dashboard</h2>

    <div class="grid">
      <div class="card">
        <h3>Controls</h3>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button onclick="sendAction('CMD:MAN_IRR,PUMP:8,AMOUNT:0.1')">Splash Pump 8</button>
          <button onclick="sendAction('CMD:MAN_IRR,PUMP:9,AMOUNT:0.1')">Splash Pump 9</button>
          <button onclick="sendAction('CMD:MAN_IRR,PUMP:10,AMOUNT:0.1')">Splash Pump 10</button>
          <button onclick="sendAction('CMD:MAN_IRR,PUMP:11,AMOUNT:0.1')">Splash Pump 11</button>
          <button onclick="sendAction('CMD:SAV_EEP')">Save to EEPROM</button>
        </div>

        <h3 style="margin-top:16px;">Telemetry Logs</h3>
        <div id="logs"></div>
        
        <div class="grid-container">
          <div class="card">
            <div class="title">Daily_Liter_8:</div>
            <div class="value" id="daily_liter_8">--</div>
          </div>

          <div class="card">
            <div class="title">Daily_Liter_9:</div>
            <div class="value" id="daily_liter_9">--</div>
          </div>
          
          <div class="card">
            <div class="title">Daily_Liter_10:</div>
            <div class="value" id="daily_liter_10">--</div>
          </div>

          <div class="card">
            <div class="title">Daily_Liter_11:</div>
            <div class="value" id="daily_liter_11">--</div>
          </div>

          <div class="card">
            <div class="title">Moisture_%_P54:</div>
            <div class="value" id="moisture_percent_P54">--</div>
          </div>

          <div class="card">
            <div class="title">Moisture_%_P55:</div>
            <div class="value" id="moisture_percent_P55">--</div>
          </div>

          <div class="card">
            <div class="title">Moisture_%_P56:</div>
            <div class="value" id="moisture_percent_P56">--</div>
          </div>

          <div class="card">
            <div class="title">Moisture_%_P57:</div>
            <div class="value" id="moisture_percent_P57">--</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>USB Camera</h3>
        <img id="cam" src="/static/latest.jpg" alt="camera feed" />

        <h3 style="margin-top:16px;">Moisture Chart</h3>
        <canvas id="chart" height="140"></canvas>
      </div>
    </div>

    <script>
      async function sendAction(name) {
        const res = await fetch("/api/action", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name })
        });
        const j = await res.json();
        // quick feedback in console
        console.log("action:", j);
      }

      // ---- Camera refresh (cache-bust with timestamp) ----
      setInterval(() => {
        const cam = document.getElementById("cam");
        cam.src = "/static/latest.jpg?ts=" + Date.now();
      }, 10000);

      // ---- Logs polling ----
      async function refreshLogs() {
        const res = await fetch("/api/logs?n=80");
        const j = await res.json();
        const el = document.getElementById("logs");
        el.textContent = j.lines.join("\n");
      }
      setInterval(refreshLogs, 10000);
      refreshLogs();

      // ---- Chart.js ----
      const ctx = document.getElementById("chart").getContext("2d");
      const chart = new Chart(ctx, {
        type: "line",
        data: {
          labels: [],
          datasets: [{
            label: "P54",
            data: [],
            tension: 0.2,
            pointRadius: 0,
            borderColor: "red"
          }, {
            label: "P55",
            data: [],
            tension: 0.2,
            pointRadius: 0,
            borderColor: "green"
          }, {
            label: "P56",
            data: [],
            tension: 0.2,
            pointRadius: 0,
            borderColor: "blue"
          }]
        },
        options: {
          responsive: true,
          animation: false,
          scales: {
            x: {
              type: 'time',
              time: {
                unit: 'minute'
              }
            },
            y: {
              beginAtZero: false
            }
          }
        }});
    
      async function refreshChart() {
        const res = await fetch("/api/metrics?n=60");
        const j = await res.json();

        chart.data.datasets = j.datasets;
        chart.update();
      }

      setInterval(refreshChart, 60000); // Refresh every 60 seconds
      refreshChart();


      // ---- Telem data in grid display ----
      async function refreshTelemData() {
        const res = await fetch("/api/logs?n=1");
        const j = await res.json();

        if (j.lines.length > 0) {
          const line = j.lines[0];

          // Remove timestamp
          const cleanLine = line.substring(line.indexOf("{"));
          
          // Convert to proper JSON
          const obj = JSON.parse(cleanLine.replace(/'/g, '"'));

          document.getElementById("daily_liter_8").textContent = obj.daily_liter_8;
          document.getElementById("daily_liter_9").textContent = obj.daily_liter_9;
          document.getElementById("daily_liter_10").textContent = obj.daily_liter_10;
          document.getElementById("daily_liter_11").textContent = obj.daily_liter_11;
          document.getElementById("moisture_percent_54").textContent = obj.moisture_percent_54;
          document.getElementById("moisture_percent_55").textContent = obj.moisture_percent_55;
          document.getElementById("moisture_percent_56").textContent = obj.moisture_percent_56;
          document.getElementById("moisture_percent_57").textContent = obj.moisture_percent_57;

          alert(obj.moisture_percent_54);
        }
      }

      setInterval(refreshTelemData, 10000); // Refresh every 10 seconds
      refreshTelemData();

    </script>
  </body>
</html>
